<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueLobster</title>
    <link rel="stylesheet" href="styl.css">
    <link rel="icon" href="BlueLobster.png">
</head>
<body>
    <main>
        <video autoplay loop muted playsinline controls>
            <source src="bruv.mp4" type="video/mp4">
        </video>
    </main>
    <script>
 
  function unlockVideo() {
    const video = document.querySelector('video');
    if (video) {
      video.muted = false;
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          console.log("Sukces: Wideo gra z dźwiękiem!");
          document.removeEventListener('click', unlockVideo);
          document.removeEventListener('touchstart', unlockVideo);
        }).catch(error => {
          console.error("Błąd odtwarzania:", error);
        });
      }
    }
  }
  document.addEventListener('click', unlockVideo);
  document.addEventListener('touchstart', unlockVideo);
</script>
</body>
</html>
