<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueLobster</title>
    <link rel="stylesheet" href="styl.css">
    <link rel="icon" href="BlueLobster.png">
</head>
<body>
    <main>
        <video autoplay loop muted playsinline controls>
            <source src="bruv.mp4" type="video/mp4">
        </video>
      </main>
      <footer>
        <p>Click anywhere for sound</p>
      </footer>
<script>
  const video = document.querySelector('video');
  const playWithSound = () => {
    if (video) {
      video.muted = false; 
      video.play().then(() => {
        console.log("Dźwięk odblokowany!");
        window.removeEventListener('click', playWithSound);
        window.removeEventListener('touchstart', playWithSound);
      }).catch(error => {
        console.log("Nadal blokuje: ", error);
      });
    }
  };
  window.addEventListener('click', playWithSound);
  window.addEventListener('touchstart', playWithSound);
</script>
</body>
</html>
